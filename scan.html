<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2196f3">
<title>Skana · 扫描</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#e3f2fd;color:#0d47a1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top{padding:9px 12px;display:flex;align-items:center;gap:8px;background:#2196f3;flex:0 0 auto;color:#fff}
.top h1{font-size:14px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .cnt{font-size:14px;font-weight:700;background:rgba(255,255,255,.3);padding:3px 10px;border-radius:999px;min-width:34px;text-align:center}
.stage{position:relative;flex:1 1 auto;background:#000;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;left:4%;right:4%;top:36%;height:28%;border:2px dashed rgba(255,255,255,.75);border-radius:10px;pointer-events:none}
.frame.oked{border-color:#22c55e;border-width:3px;border-style:solid}
.state{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:#e3f2fd;text-shadow:0 1px 3px #000;padding:0 10px}
.last{position:absolute;left:8px;top:8px;right:8px;background:rgba(22,163,74,.96);border-radius:14px;padding:10px 12px;display:none;color:#fff;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.45)}
.last .ok{font-size:15px;font-weight:700;letter-spacing:2px}
.last .sub{font-size:12px;opacity:.95;margin-top:2px}
.hud{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:5}
.hud button{background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:9px 11px;font-size:13px}
.panel{flex:0 0 auto;background:#fff;padding:8px 12px 12px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row input{flex:1;min-width:0;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid #90caf9;background:#f5faff;color:#0d47a1;outline:none}
.btn{font-size:15px;padding:11px 14px;border-radius:10px;border:0;font-weight:600;color:#fff;background:#2196f3}
.btn2{background:#e3f2fd;border:1px solid #90caf9;color:#1565c0}
.list{max-height:18vh;overflow:auto;margin:4px 0 8px}
.list .rowi{display:flex;align-items:center;justify-content:space-between;font-size:15px;padding:7px 10px;border-bottom:1px solid #bbdefb;color:#0d47a1}
.list .rowi em{font-style:normal;color:#1976d2;padding:0 6px;font-size:16px}
.muted{font-size:12px;color:#5c7a99;line-height:1.5}
</style>
</head>
<body>
<div class="top">
  <h1 id="ttl">📡 Skana · 扫描</h1>
  <span class="cnt" id="cnt">0</span>
</div>

<div class="stage" id="stage">
  <video id="v" playsinline muted autoplay></video>
  <div class="frame" id="frame"></div>
  <div class="last" id="last"><div class="ok" id="lastCode"></div><div class="sub" id="lastSub"></div></div>
  <div class="state" id="st">Inaanza kamera... · 正在打开摄像头...</div>
  <div class="hud">
    <button id="torchBtn" type="button">💡</button>
    <button id="zoomIn" type="button">＋</button>
    <button id="zoomOut" type="button">－</button>
  </div>
</div>

<div class="panel">
  <div class="row">
    <input id="q" inputmode="numeric" autocomplete="off" placeholder="Au andika / bandika namba · 手输或粘贴表号">
    <button class="btn" id="addBtn" type="button">Ongeza · 加入</button>
  </div>
  <div class="list" id="list"></div>
  <div class="row">
    <button class="btn2 btn" id="clearBtn" type="button" style="flex:1">Futa · 清空</button>
    <button class="btn" id="doneBtn" type="button" style="flex:2">Maliza na rudi · 完成并返回</button>
  </div>
  <div class="row" style="margin-bottom:0">
    <button class="btn2 btn" id="backOnly" type="button" style="flex:1">↩ Rudi kwenye mfumo · 只回系统</button>
  </div>
  <div class="muted" id="msg">Weka barcode <strong>ILI IJAZE fremu</strong> (15–25 cm); giza? gusa 💡; ikishindikana, gusa skrini kuza. · 让条码<strong>左右撑满虚线框</strong>（离 15–25 厘米）；太暗点 💡；读不到<strong>点屏幕放大一级</strong>。</div>
  <div class="muted" id="modeTip" style="margin-top:4px;color:#1565c0"></div>
</div>

<script>
/* ================= 参数 / 模式 ================= */
var HS = new URLSearchParams((location.hash || '').replace(/^#/, ''));
var Q = new URLSearchParams(location.search);
function P(k) { return Q.get(k) || HS.get(k) || ''; }

var FALLBACK_EXEC = 'https://script.google.com/macros/s/AKfycbxir9G60dx_mNq-5V73J2UeaKwrZUtMidkxklg7VoSwIcmfFu0LASswUG_ZG3pjpyWvCQ/exec';
var EXEC_URL = P('d') || localStorage.getItem('em_exec') || FALLBACK_EXEC;
var MODE = String(P('m') || 'out').toLowerCase();
var TEAM = P('team') || P('t') || localStorage.getItem('em_team') || '';
var TOK = P('tok') || P('k') || localStorage.getItem('em_tok') || '';
try {
  if (P('d')) localStorage.setItem('em_exec', P('d'));
  if (P('team')) localStorage.setItem('em_team', P('team'));
  if (P('tok')) localStorage.setItem('em_tok', P('tok'));
} catch (e) {}

/* 每种业务一套独立扫描逻辑，系统里点到哪个就带 m= 打开哪套：
 *   install 安装 —— 连续扫一叠表，扫完回去系统里一块一块填（填完自动接下一块）
 *   out     出库 —— 连续扫，按批次
 *   in      入库 —— 连续扫，按批次
 *   ret     退货 —— 连续扫（整批退回）
 *   sw      更换 —— 成对扫：第 1 个是旧表，第 2 个是新表，一对一对地积
 */
var PROFILES = {
  /* single: 一次只扫一块，读到立刻返回；pair: 旧表+新表一组；否则连续扫多块 */
  /* ★ 安装：scanner 只收 1 块 → 0.9 秒后自动回「电表核对/登记」页，绝不连扫 */
  install: { label: 'Kufunga · 安装（1 块/次）', back: 'install', tab: '', pair: false, single: true, box: false,
             tip: 'Mita MOJA kwa skana moja — ikisomwa mara ya kwanza inarudi moja kwa moja kwenye ukaguzi. · 安装一次只扫一块：读到表号立刻自动返回「电表核对」页面，不会连扫第二块。' },
  out:     { label: 'Kutolea · 出库', back: 'out',     tab: '',    pair: false, single: false, box: true,
             tip: 'Endelea kuskani mita zote za kundi hili, kisha Maliza. · 出库可连续扫：把这一批全部扫完，再点完成返回。' },
  in:      { label: 'Kupokea · 入库', back: 'in',      tab: 'in',  pair: false, single: false, box: true,
             tip: 'Endelea kuskani mita zote zilizoingia ghala, kisha Maliza. · 入库可连续扫：把这一批到货全部扫完，再点完成返回。' },
  ret:     { label: 'Kurudisha · 退货', back: 'ret',   tab: 'ret', pair: false, single: false, box: false,
             tip: 'Endelea kuskani mita zote zinazorudishwa, kisha Maliza. · 退货可连续扫：把要退回的全部扫完，再点完成返回。' },
  sw:      { label: 'Kubadilisha · 更换', back: 'sw',  tab: 'sw',  pair: true,  single: false, box: false,
             tip: 'Skana mita ya ZAMANI kwanza, kisha ya MPYA — pair = kumbukumbu moja. · 更换：先扫「旧表」再扫「新表」，一对就是一条记录（旧表转故障、新表转出库）；可连续配多对。' }
};
var MI = PROFILES[MODE] || PROFILES.install;
document.getElementById('ttl').textContent = '📡 ' + MI.label;
if (MI.pair) document.getElementById('list').style.maxHeight = '26vh';

/* ================= 状态 ================= */
var CODES = [], STREAM = null, TRACK = null, TORCH = false, ZOOMF = 1, ZOOMC = null;
var LAST_CODE = '', LAST_TIME = 0, SESSION_KEY = 'em_scan_codes_v2';
try {
  var saved = sessionStorage.getItem(SESSION_KEY);
  if (saved) CODES = JSON.parse(saved) || [];
} catch (e) { CODES = []; }
function persist() { try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(CODES)); } catch (e) {} }

/* 更换模式：两个一组 */
var PAIRS = [], SWSLOT = 'old';
var PSESSION = 'em_scan_pairs_v2';
try {
  var sp = sessionStorage.getItem(PSESSION);
  if (sp) PAIRS = JSON.parse(sp) || [];
} catch (e) { PAIRS = []; }
function persistPairs() { try { sessionStorage.setItem(PSESSION, JSON.stringify(PAIRS)); } catch (e) {} }

/* ================= 反馈 ================= */
function beep(ok) {
  try {
    var ac = window.__AC || (window.__AC = new (window.AudioContext || window.webkitAudioContext)());
    if (ac.state === 'suspended') ac.resume();
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square';
    o.frequency.value = ok ? 1050 : 420;
    g.gain.value = ok ? 0.09 : 0.06;
    o.connect(g); g.connect(ac.destination); o.start();
    setTimeout(function () { o.stop(); }, ok ? 70 : 40);
  } catch (e) {}
  try {
    if (navigator.vibrate) navigator.vibrate(ok ? 45 : [60, 40, 60]);
  } catch (e) {}
}
function digits(v) {
  var s = String(v || ''), o = '';
  for (var i = 0; i < s.length; i++) { var c = s.charAt(i); if (c >= '0' && c <= '9') o += c; }
  return o;
}
/** 从解码结果里取出 11 位表号：优先「独立的一串 11 位数字」，避免把 12 位串截错 */
function pickMeter(raw) {
  var s = String(raw || '');
  var re = /\d{11}/g, m;
  while ((m = re.exec(s))) {
    var b = s.charAt(m.index - 1), a = s.charAt(m.index + 11);
    var bd = (b >= '0' && b <= '9'), ad = (a >= '0' && a <= '9');
    if (!bd && !ad) return m[0];
  }
  var d = digits(s);
  if (d.length === 11) return d;
  return '';
}
function setState(t) { document.getElementById('st').textContent = t; }
function banner(code, sub, ok) {
  var el = document.getElementById('last');
  document.getElementById('lastCode').textContent = (ok ? '✓ ' : '⚠ ') + code;
  document.getElementById('lastSub').textContent = sub || '';
  el.style.background = ok ? 'rgba(22,163,74,.96)' : 'rgba(220,38,38,.96)';
  el.style.display = 'block';
  var f = document.getElementById('frame');
  f.className = 'frame' + (ok ? ' oked' : '');
  clearTimeout(window.__LT);
  window.__LT = setTimeout(function () {
    el.style.display = 'none';
    f.className = 'frame';
  }, ok ? 1400 : 2200);
}

/* ================= 清单 ================= */
function ui() {
  var el = document.getElementById('list'), cnt = document.getElementById('cnt');
  if (MI.pair) {
    cnt.textContent = PAIRS.length;
    var nextLab = (SWSLOT === 'old' ? '<b style="color:#e5484d">➊ Skana mita ya ZAMANI · 请扫「旧表」</b>' : '<b style="color:#0a7f5a">➋ Skana mita MPYA · 请扫「新表」</b>');
    el.innerHTML = nextLab + (PAIRS.map(function (pr, i) {
      return '<div class="rowi"><b>' + pr[0] + ' → ' + pr[1] + '</b><em onclick="delPair(' + i + ')">✕</em></div>';
    }).join('') || '<div class="muted">Bado hakuna pair · 还没配成一组</div>');
    return;
  }
  cnt.textContent = CODES.length;
  if (MI.single) {
    el.innerHTML = CODES.length
      ? '<div class="rowi"><b>' + CODES[0] + '</b></div><div class="muted">Mita hii inapelekwa kwenye ukaguzi · 这一块会直接送到「电表核对」页</div>'
      : '<div class="muted">Subiri mita moja · 等待扫描一块（一次只收一块）</div>';
    return;
  }
  el.innerHTML = CODES.map(function (c, i) {
    return '<div class="rowi"><b>' + c + '</b><em onclick="del(' + i + ')">✕</em></div>';
  }).join('') || '<div class="muted">Bado hakuna · 还没扫到</div>';
}
window.del = function (i) { CODES.splice(i, 1); persist(); ui(); };
window.delPair = function (i) { PAIRS.splice(i, 1); persistPairs(); ui(); };

/* ================= 接收一个码 ================= */
function accept(raw) {
  var m = pickMeter(raw);
  if (!m) {
    var d = digits(raw);
    if (d.length >= 5) {
      setState('⚠ Namba si sahihi: imepata ' + d.length + ' tarakumu (inahitaji 11) · ⚠ 表号位数不对：读到 ' + d.length + ' 位（应为 11 位），请只对准表号条码重扫');
      beep(false);
    }
    return false;
  }
  var now = Date.now();
  if (m === LAST_CODE && now - LAST_TIME < 900) return false;          // 同一码 0.9 秒内不重复触发

  /* ---- 更换：旧表 → 新表 成对 ---- */
  if (MI.pair) {
    for (var pi = 0; pi < PAIRS.length; pi++) {
      if (PAIRS[pi][0] === m || PAIRS[pi][1] === m) {
        LAST_CODE = m; LAST_TIME = now;
        banner(m, 'Ishatumika kwenye pair · 这块已经配过组了', false);
        beep(false);
        return false;
      }
    }
    LAST_CODE = m; LAST_TIME = now;
    if (SWSLOT === 'old') {
      CODES.push(m); persist();
      SWSLOT = 'new';
      ui();
      banner(m, 'ZAMANI ✓ · 旧表已记下，接着扫「新表」', true);
      beep(true);
      return true;
    }
    var oldM = CODES.length ? CODES[CODES.length - 1] : '';
    if (!oldM || oldM === m) {                                          // 同一个码连扫两次
      banner(m, 'Mita moja haiwezi kuwa zamani na mpya · 旧表和新表不能是同一块', false);
      beep(false);
      return false;
    }
    CODES.pop();                                                        // 旧表从未配对暂存里取出
    persist();
    PAIRS.push([oldM, m]);
    persistPairs();
    SWSLOT = 'old';
    ui();
    banner(oldM + ' → ' + m, 'Pair ' + PAIRS.length + ' imeongezwa · 已配成第 ' + PAIRS.length + ' 组', true);
    beep(true);
    return true;
  }

  /* ---- 普通连续模式 ---- */
  if (CODES.indexOf(m) >= 0) {                                         // 清单里已有
    LAST_CODE = m; LAST_TIME = now;
    banner(m, 'Ishatiwa · 这一块已在清单里', false);
    beep(false);
    return false;
  }
  LAST_CODE = m; LAST_TIME = now;
  CODES = [m];                                                          // 单块模式永远只有这一块
  persist();
  ui();
  banner(m, 'Zimeongezwa ' + CODES.length + ' · 已加入 ' + CODES.length + ' 块', true);
  beep(true);
  if (MI.single) {                                                      // 安装：一块即返回核对页
    CODES = [m]; persist();
    ui();
    setState('✓ ' + m + ' — narudi kwenye ukaguzi · 已读到，0.9 秒后自动返回「电表核对」页');
    document.getElementById('doneBtn').disabled = true;
    setTimeout(goBack, 900);
  }
  return true;
}

/* ================= 返回系统 ================= */
function goBack() {
  if (!EXEC_URL) EXEC_URL = FALLBACK_EXEC;
  var sep = EXEC_URL.indexOf('?') >= 0 ? '&' : '?';
  var tab = MI.tab ? ('&tab=' + MI.tab) : '';
  var flat = CODES.slice();
  if (MI.pair) {
    flat = [];                                                          // 旧表→新表 平铺成 o1,n1,o2,n2
    for (var i = 0; i < PAIRS.length; i++) { flat.push(PAIRS[i][0]); flat.push(PAIRS[i][1]); }
  }
  location.href = EXEC_URL + sep + 'mode=' + MI.back +
    '&m=' + encodeURIComponent(flat.join(',')) + tab +
    '&team=' + encodeURIComponent(TEAM) + '&tok=' + encodeURIComponent(TOK) + '&fresh=1';
}

document.getElementById('doneBtn').onclick = function () { goBack(); };
document.getElementById('backOnly').onclick = function () { CODES = []; PAIRS = []; persist(); persistPairs(); goBack(); };
document.getElementById('clearBtn').onclick = function () { CODES = []; PAIRS = []; SWSLOT = 'old'; persist(); persistPairs(); ui(); };
document.getElementById('doneBtn').textContent = MI.pair
  ? 'Maliza na rudi · 完成并返回（带上所有配对）'
  : (MI.single ? 'Rudi bila kuskani · 不扫了，直接返回' : 'Maliza na rudi · 完成并返回');

/* 手输 / 粘贴（支持逗号、空格、换行一次贴多块） */
function addManual(text) {
  var parts = String(text || '').split(/[^0-9]+/).filter(function (x) { return x.length === 11; });
  var added = 0, bad = 0;
  if (!parts.length) {
    var one = pickMeter(text);
    if (one) parts = [one]; else bad = 1;
  }
  parts.forEach(function (m) { if (accept(m)) added++; });
  return { added: added, bad: bad || (parts.length ? 0 : 1) };
}
document.getElementById('addBtn').onclick = function () {
  var q = document.getElementById('q');
  var t = q.value.trim();
  if (!t) return;
  var r = addManual(t);
  q.value = '';
  if (r.bad) { setState('⚠ Weka tarakumu 11 · 请填/粘贴 11 位表号'); beep(false); }
  q.focus();
};
document.getElementById('q').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('addBtn').click();
});

/* ================= 摄像头 ================= */
function startCamera() {
  var v = document.getElementById('v');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setState('Kamera haipatikani — andika kwa mkono. · 这台手机不支持摄像头，请手输号码。');
    return;
  }
  var tries = [
    { audio: false, video: { facingMode: { ideal: 'environment' }, width: { exact: 1920 }, height: { exact: 1080 }, focusMode: { ideal: 'continuous' } } },
    { audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } },
    { audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } },
    { audio: false, video: { facingMode: { ideal: 'environment' } } }
  ];
  var idx = 0;
  function tryNext() {
    if (idx >= tries.length) {
      setState('Imeshindikana kufungua kamera — ruhusu kamera au andika kwa mkono · 打不开摄像头，请允许权限或手输');
      return;
    }
    navigator.mediaDevices.getUserMedia(tries[idx++]).then(function (s) {
      STREAM = s; TRACK = s.getVideoTracks()[0] || null;
      v.srcObject = s; v.play();
      try { ZOOMC = TRACK.getCapabilities ? TRACK.getCapabilities().zoom : null; } catch (e) { ZOOMC = null; }
      try { if (TRACK.getCapabilities && TRACK.getCapabilities().focusMode && TRACK.getCapabilities().focusMode.indexOf('continuous') >= 0) TRACK.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
      var st = TRACK && TRACK.getSettings ? TRACK.getSettings() : {};
      setState('Kamera tayari · 摄像头已开 ' + (st.width || '') + 'x' + (st.height || '') + ' — skana sasa · 可以对准扫了');
      startScanning(v);
    }).catch(function () { tryNext(); });
  }
  tryNext();
}

function applyZoom() {
  if (!TRACK || !ZOOMC) { setState('Zoom haipatikani · 这台手机不支持变焦，请靠近条码'); return; }
  var z = Math.min(ZOOMC.max || 1, Math.max(ZOOMC.min || 1, ZOOMF));
  try { TRACK.applyConstraints({ advanced: [{ zoom: z }] }); setState('Zoom ' + z + 'x · 已放大'); } catch (e) {}
}
document.getElementById('torchBtn').onclick = function () {
  if (!TRACK) return;
  TORCH = !TORCH;
  try { TRACK.applyConstraints({ advanced: [{ torch: TORCH }] }); } catch (e) {}
  this.style.background = TORCH ? 'rgba(250,204,21,.9)' : 'rgba(0,0,0,.62)';
  this.style.color = TORCH ? '#111' : '#fff';
};
document.getElementById('zoomIn').onclick = function () { ZOOMF = Math.min(8, ZOOMF + 0.5); applyZoom(); };
document.getElementById('zoomOut').onclick = function () { ZOOMF = Math.max(1, ZOOMF - 0.5); applyZoom(); };
document.getElementById('stage').addEventListener('click', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (!TRACK) return;
  ZOOMF = Math.min(8, Math.max(1, ZOOMF + 1));
  applyZoom();
  setState('Nimekuza · 已放大，对准条码再等一秒');
});

/* 屏幕常亮（扫一箱也不黑屏） */
try {
  navigator.wakeLock && navigator.wakeLock.request('screen').catch(function () {});
} catch (e) {}

/* ================= 取样 =================
 * 现场两种条码：①电表本体标签——条码是「竖排」的（标签旋转 90°）
 *              ②纸箱标签——条码横排，一箱 6 个
 * 所以每帧都同时解「横向带」和「旋转 90° 的同一块」，哪个先读到就收。
 * 1D 条码怕糊：只用原分辨率（最多缩到 1600 宽），不激进降采样。
 */
var NATIVE = (typeof BarcodeDetector !== 'undefined');
var FORMATS = ['code_128', 'code_39', 'itf', 'code_93', 'codabar', 'ean_13', 'qr_code', 'data_matrix', 'ean_8'];
var cvH = document.createElement('canvas'), cxH = cvH.getContext('2d', { willReadFrequently: true });
var cvV = document.createElement('canvas'), cxV = cvV.getContext('2d', { willReadFrequently: true });
var MAXW = 1600;

var POS = [
  { sy: 0.30, sh: 0.40 },   // 中间（最常见）
  { sy: 0.18, sh: 0.62 },   // 偏上 / 大范围
  { sy: 0.34, sh: 0.30 }    // 窄带（贴近、条码很大）
];
var SCALES = [1, 1.5];      // 小条码（电表本体标签）靠 1.5 倍放大才稳

function cropH(v, pos, scale) {
  var vw = v.videoWidth, vh = v.videoHeight;
  var sx = Math.round(vw * 0.02), sw = Math.round(vw * 0.96);
  var sy = Math.round(vh * pos.sy), sh = Math.round(vh * pos.sh);
  var sc = sw > MAXW ? MAXW / sw : 1;
  cvH.width = Math.round(sw * sc * scale); cvH.height = Math.round(sh * sc * scale);
  cxH.imageSmoothingEnabled = true;
  cxH.drawImage(v, sx, sy, sw, sh, 0, 0, cvH.width, cvH.height);
  return cvH;
}

/** 同一块区域旋转 90°：让「竖排条码」变成横排再解（电表本体标签就是竖排） */
function cropV(v, pos, scale) {
  var vw = v.videoWidth, vh = v.videoHeight;
  var sx = Math.round(vw * 0.02), sw = Math.round(vw * 0.96);
  var sy = Math.round(vh * pos.sy), sh = Math.round(vh * pos.sh);
  var sc = sw > MAXW ? MAXW / sw : 1;
  var w = Math.round(sw * sc * scale), h = Math.round(sh * sc * scale);
  cvV.width = h; cvV.height = w;                       // 交换宽高
  cxV.imageSmoothingEnabled = true;
  cxV.save();
  cxV.translate(h / 2, w / 2);
  cxV.rotate(-Math.PI / 2);
  cxV.drawImage(v, sx, sy, sw, sh, -w / 2, -h / 2, w, h);
  cxV.restore();
  return cvV;
}

/* ================= 引擎 ================= */
var det = null, ZXOK = false;

function buildDetector() {
  if (!NATIVE) return Promise.resolve(null);
  var mk = function (list) {
    try { return new BarcodeDetector({ formats: list.length ? list : ['code_128'] }); } catch (e) { return null; }
  };
  if (!BarcodeDetector.getSupportedFormats) return Promise.resolve(mk(FORMATS));
  return BarcodeDetector.getSupportedFormats().then(function (sup) {
    var ok = FORMATS.filter(function (f) { return sup.indexOf(f) >= 0; });
    return ok.length ? mk(ok) : null;
  }).catch(function () { return mk(['code_128']); });
}

var W_PREP = null;
function ensureWasm() {
  if (ZXOK) return Promise.resolve(true);
  if (W_PREP) return W_PREP;
  W_PREP = new Promise(function (res) {
    var sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.1/dist/iife/reader/index.js';
    sc.onload = function () {
      try {
        var pr = ZXingWASM.prepareZXingModule({ overrides: { locateFile: function (f) { return 'https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.1/dist/reader/' + f; } } });
        if (pr && pr.then) pr.then(function () { ZXOK = true; res(true); }, function () { res(false); });
        else { ZXOK = true; res(true); }
      } catch (e) { res(false); }
    };
    sc.onerror = function () { res(false); };
    document.head.appendChild(sc);
  });
  return W_PREP;
}

function zxRead(canvas) {
  if (!ZXOK || !canvas.width) return Promise.resolve('');
  var img = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
  return ZXingWASM.readBarcodes(img, {
    formats: ['Code128', 'Code39', 'ITF', 'Codabar', 'Code93', 'EAN-13'],
    tryHarder: true,
    tryRotate: true,
    tryDownscale: false,
    maxNumberOfSymbols: 3
  }).then(function (rs) {
    for (var i = 0; i < (rs || []).length; i++) { if (rs[i] && rs[i].text) return rs[i].text; }
    return '';
  }).catch(function () { return ''; });
}

/* ================= 主循环 ================= */
var BUSY = false, PI = 0, MISS = 0;
function startScanning(v) {
  var nativeP = buildDetector();
  var wasmP = ensureWasm();
  Promise.all([nativeP, wasmP]).then(function (r) {
    det = r[0];
    ZXOK = !!r[1];
    setState(ZXOK
      ? (det ? 'Skana tayari · 可以扫了（双引擎：横排+竖排都识）' : 'Skana tayari · 可以扫了（备用引擎）')
      : (det ? 'Skana tayari · 可以扫了（手机自带引擎）' : 'Hakuna kifaa cha kusoma — andika kwa mkono · 没有可用解码引擎，请手输'));
    loop(v);
  });
}

var SI = 0;
function loop(v) {
  var tick = function () {
    if (BUSY || !v.videoWidth) { setTimeout(tick, 55); return; }
    BUSY = true;
    var pos = POS[PI], scale = SCALES[SI];
    PI = (PI + 1) % POS.length;
    if (PI === 0) SI = (SI + 1) % SCALES.length;
    var ch = cropH(v, pos, scale), cvr = cropV(v, pos, scale);

    var jobs = [];
    if (ZXOK) { jobs.push(zxRead(ch)); jobs.push(zxRead(cvr)); }
    if (det) jobs.push(det.detect(ch).then(function (cs) { return (cs && cs[0] && cs[0].rawValue) || ''; }).catch(function () { return ''; }));

    Promise.all(jobs).then(function (vals) {
      BUSY = false;
      var got = false;
      for (var i = 0; i < vals.length && !got; i++) {
        var raw = vals[i];
        if (raw) got = accept(raw);
        if (got) break;
      }
      if (got) { MISS = 0; setTimeout(tick, 60); return; }
      MISS++;
      if (MISS === 8) setState('Bado haijasoma — songa karibu zaidi hadi mita 0.2, ipitishe kwenye mstari · 还读不到：请靠近到 20cm 以内，把标签条码撑满虚线框（本体标签条码是竖的，系统已自动横竖各扫一遍）');
      if (MISS === 20) { if (ZOOMC) { ZOOMF = Math.min(8, ZOOMF + 1); applyZoom(); } else setState('Kiwango cha zoom hakipo — karibia zaidi · 手机不支持变焦，请把手机贴近标签'); MISS = 0; }
      setTimeout(tick, 55);
    });
  };
  tick();
}

/* 启动 */
if (MI.single) { CODES = []; persist(); }        // 单块模式每次进来只认一块，不带上一次残留
document.getElementById('modeTip').textContent = MI.tip;
ui();
startCamera();
</script>
</body>
